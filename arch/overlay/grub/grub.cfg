# GRUB menu for the COLI Linux archiso live image.
# archiso supports GRUB on UEFI; Syslinux remains the legacy BIOS loader.

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

if loadfont "${prefix}/fonts/unicode.pf2"; then
  insmod all_video
  set gfxmode="auto"
  terminal_input console
  terminal_output console
fi

if [ "${grub_platform}" == 'efi' ]; then
  coli_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
  coli_platform='BIOS'
else
  coli_platform="${grub_cpu}-${grub_platform}"
fi

default=coli-live
timeout=10
timeout_style=menu

menuentry "COLI Linux Live (%ARCH%, ${coli_platform})" --class arch --class gnu-linux --class gnu --class os --id 'coli-live' {
  set gfxpayload=keep
  linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash
  initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" == 'efi' ]; then
  menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
    fwsetup
  }
fi

menuentry 'System shutdown' --class shutdown --class poweroff {
  echo 'System shutting down...'
  halt
}

menuentry 'System restart' --class reboot --class restart {
  echo 'System rebooting...'
  reboot
}
